name: Build HoneyVoice VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-vst3:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout HoneyVoice
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 Plugin
        run: cmake --build build --config Release --parallel

      - name: Package VST3 Artifact
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.vst3" -exec cp -r {} dist/ \;

      - name: Upload HoneyVoice VST3
        uses: actions/upload-artifact@v4
        with:
          name: HoneyVoice-VST3-${{ matrix.os }}
          path: dist/*.vst3
